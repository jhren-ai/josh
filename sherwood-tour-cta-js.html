<div id="scs-cta-root"></div>
<script>
(function () {
  /* ===== EDIT HERE ===================================================== */
  var COLORS = {
    accent:      "#1F4E79", /* buttons, outline */
    accentHover: "#163A5B", /* button on hover */
    accentSoft:  "#E8EEF5", /* panel background */
    buttonText:  "#FFFFFF"
  };

  var TEXT = "If you're considering immediate enrollment for your child, call our office and request a personal tour so we can expedite your application process and introduce you to our community as quickly as possible.";

  var PHONE_LABEL = "Call (503) 925-8007";
  var PHONE_LINK  = "tel:+15039258007";

  var TOUR_LABEL  = "Request a Tour";
  var TOUR_URL    = "https://sherwoodcharterschool.org/enrollment/tour-request/";
  /* ===================================================================== */

  var root = document.getElementById("scs-cta-root");
  if (!root) return;

  var css = [
    ".scs-cta{--a:" + COLORS.accent + ";--ah:" + COLORS.accentHover + ";--as:" + COLORS.accentSoft + ";--bt:" + COLORS.buttonText + ";",
    "font-family:inherit;color:inherit;max-width:1200px;margin:0 auto;padding:10px;}",
    ".scs-cta *,.scs-cta *::before,.scs-cta *::after{box-sizing:border-box;}",
    ".scs-cta .scs-cta__panel{max-width:900px;margin:0 auto;padding:clamp(1.75rem,4vw,2.75rem) clamp(1.25rem,4vw,3rem);",
    "background:var(--as);border-radius:12px;text-align:center;}",
    ".scs-cta p.scs-cta__text{max-width:720px;margin:0 auto 1.5rem;font-size:clamp(1.05rem,.6vw + .9rem,1.25rem);line-height:1.6;}",
    ".scs-cta .scs-cta__btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;}",
    ".scs-cta a.scs-cta__btn{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 1.75rem;border-radius:999px;",
    "font-weight:700;font-size:1rem;line-height:1.2;letter-spacing:.02em;text-decoration:none;",
    "transition:background-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;}",
    ".scs-cta a.scs-cta__btn svg{width:18px;height:18px;flex:0 0 18px;}",
    /* solid: phone */
    ".scs-cta a.scs-cta__btn--solid{background:var(--a);color:var(--bt);border:2px solid var(--a);box-shadow:0 6px 16px -8px rgba(0,0,0,.35);}",
    ".scs-cta a.scs-cta__btn--solid:hover,.scs-cta a.scs-cta__btn--solid:focus-visible{background:var(--ah);border-color:var(--ah);color:var(--bt);transform:translateY(-2px);text-decoration:none;}",
    /* outline: tour */
    ".scs-cta a.scs-cta__btn--line{background:transparent;color:var(--a);border:2px solid var(--a);}",
    ".scs-cta a.scs-cta__btn--line:hover,.scs-cta a.scs-cta__btn--line:focus-visible{background:var(--a);color:var(--bt);transform:translateY(-2px);text-decoration:none;}",
    ".scs-cta a.scs-cta__btn:focus-visible{outline:3px solid var(--a);outline-offset:3px;}",
    "@media (max-width:480px){.scs-cta a.scs-cta__btn{width:100%;justify-content:center;}}",
    "@media (prefers-reduced-motion:reduce){.scs-cta a.scs-cta__btn{transition:none;}.scs-cta a.scs-cta__btn:hover{transform:none;}}"
  ].join("");

  if (!document.getElementById("scs-cta-style")) {
    var style = document.createElement("style");
    style.id = "scs-cta-style";
    style.textContent = css;
    document.head.appendChild(style);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }
  var ICON_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
  var ICON_CAL   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';

  function button(cls, href, label, icon) {
    var a = el("a", "scs-cta__btn " + cls);
    a.href = href;
    a.innerHTML = icon;
    a.appendChild(el("span", "", label));
    return a;
  }

  var section = el("section", "scs-cta");
  section.setAttribute("aria-label", "Schedule a tour");
  var panel = el("div", "scs-cta__panel");
  panel.appendChild(el("p", "scs-cta__text", TEXT));

  var btns = el("div", "scs-cta__btns");
  if (PHONE_LABEL) btns.appendChild(button("scs-cta__btn--solid", PHONE_LINK, PHONE_LABEL, ICON_PHONE));
  if (TOUR_LABEL)  btns.appendChild(button("scs-cta__btn--line", TOUR_URL, TOUR_LABEL, ICON_CAL));
  panel.appendChild(btns);

  section.appendChild(panel);
  root.appendChild(section);
})();
</script>
