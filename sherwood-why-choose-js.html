<!-- Sherwood Charter School — "Why Choose SCS" tiles (all-in-one JavaScript version)
     Paste this whole snippet into ONE "Custom HTML" block (or a page builder's HTML / code widget). -->
<div id="scs-why-root"></div>
<script>
(function () {
  /* ===== EDIT HERE ===================================================== */
  var COLORS = {
    accent:     "#1F4E79", /* numbers, top bar, hover border */
    accentSoft: "#E8EEF5", /* circle behind the icon */
    tileBg:     "#FFFFFF",
    border:     "#DCE1E7"
  };

  var TITLE = "Why Choose Sherwood Charter School";

  /* Icons: upload to Media > Add New, click the image, "Copy URL to clipboard",
     and paste it between the quotes after icon:. Leave "" to show the placeholder. */
  var TILES = [
    {
      icon: "",
      title: "Academic Environment",
      text: "SCS offers a safe, supportive, and academically rigorous environment where students are known and encouraged to grow. Classrooms are active and hands-on, designed to foster achievement and a genuine love of learning."
    },
    {
      icon: "",
      title: "Small Class Sizes",
      text: "With small class sizes, teachers and administrators have the time to get to know each student. This allows for personalized support, stronger connections with students and their families, and lesson plans that meet students where they are."
    },
    {
      icon: "",
      title: "Character Formation",
      text: "At SCS, developing strong character matters just as much as academic success. By focusing on HEART values, students learn to show respect, take responsibility, and care for others. These skills shape who they become both inside and outside of the classroom."
    },
    {
      icon: "",
      title: "Critical Thinking & Lifelong Learning",
      text: "Students at SCS are encouraged to wonder, ask questions, and make connections across subjects in their learning. Over time, they build the confidence and skills to solve complex problems, think independently, and continue learning wherever life takes them."
    }
  ];
  /* ===================================================================== */

  var root = document.getElementById("scs-why-root");
  if (!root) return;

  var css = [
    ".scs-why{--a:" + COLORS.accent + ";--as:" + COLORS.accentSoft + ";--bg:" + COLORS.tileBg + ";--bd:" + COLORS.border + ";",
    "font-family:inherit;color:inherit;max-width:1200px;margin:0 auto;padding:10px;}",
    ".scs-why *,.scs-why *::before,.scs-why *::after{box-sizing:border-box;}",
    ".scs-why h2.scs-why__title{margin:0 0 clamp(1.75rem,4vw,2.75rem);text-align:center;}",
    ".scs-why ol.scs-why__grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem;}",
    "@media (max-width:1024px){.scs-why ol.scs-why__grid{grid-template-columns:repeat(2,1fr);}}",
    "@media (max-width:600px){.scs-why ol.scs-why__grid{grid-template-columns:1fr;}}",
    ".scs-why li.scs-why__tile{position:relative;display:flex;flex-direction:column;list-style:none;margin:0;padding:2rem 1.5rem 1.75rem;",
    "background:var(--bg);border:1px solid var(--bd);border-radius:12px;overflow:hidden;",
    "transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;}",
    ".scs-why li.scs-why__tile::marker{content:none;}",
    ".scs-why li.scs-why__tile::before{content:'';position:absolute;top:0;left:0;height:4px;width:2.5rem;background:var(--a);transition:width .3s ease;}",
    ".scs-why li.scs-why__tile:hover,.scs-why li.scs-why__tile:focus-within{transform:translateY(-6px);border-color:var(--a);box-shadow:0 14px 30px -12px rgba(0,0,0,.22);}",
    ".scs-why li.scs-why__tile:hover::before,.scs-why li.scs-why__tile:focus-within::before{width:100%;}",
    ".scs-why .scs-why__head{display:flex;align-items:center;justify-content:space-between;margin:0 0 1.25rem;}",
    ".scs-why .scs-why__icon{display:flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:50%;background:var(--as);transition:transform .25s ease;}",
    ".scs-why li.scs-why__tile:hover .scs-why__icon{transform:scale(1.06);}",
    ".scs-why .scs-why__icon img{display:block;width:56%;height:56%;margin:0;object-fit:contain;}",
    ".scs-why .scs-why__ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border:2px dashed var(--a);border-radius:50%;",
    "font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--a);opacity:.6;}",
    ".scs-why .scs-why__num{font-size:2rem;font-weight:700;line-height:1;color:var(--a);opacity:.25;transition:opacity .25s ease;}",
    ".scs-why li.scs-why__tile:hover .scs-why__num{opacity:.6;}",
    ".scs-why h3.scs-why__tile-title{margin:0 0 .75rem;padding:0;font-size:1.35rem;line-height:1.25;}",
    ".scs-why li.scs-why__tile p{margin:0;font-size:1rem;line-height:1.6;}",
    "@media (prefers-reduced-motion:reduce){.scs-why li.scs-why__tile,.scs-why li.scs-why__tile::before,.scs-why .scs-why__icon,.scs-why .scs-why__num{transition:none;}",
    ".scs-why li.scs-why__tile:hover,.scs-why li.scs-why__tile:focus-within,.scs-why li.scs-why__tile:hover .scs-why__icon{transform:none;}}"
  ].join("");

  if (!document.getElementById("scs-why-style")) {
    var style = document.createElement("style");
    style.id = "scs-why-style";
    style.textContent = css;
    document.head.appendChild(style);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }

  var section = el("section", "scs-why");
  section.setAttribute("aria-labelledby", "scs-why-title");
  var h2 = el("h2", "scs-why__title", TITLE);
  h2.id = "scs-why-title";
  section.appendChild(h2);

  var list = el("ol", "scs-why__grid");
  TILES.forEach(function (t, i) {
    var li = el("li", "scs-why__tile");
    var head = el("div", "scs-why__head");
    var icon = el("div", "scs-why__icon");
    if (t.icon) {
      var img = el("img");
      img.src = t.icon;
      img.alt = "";
      img.width = 56;
      img.height = 56;
      icon.appendChild(img);
    } else {
      icon.appendChild(el("span", "scs-why__ph", "Icon"));
    }
    var num = el("span", "scs-why__num", ("0" + (i + 1)).slice(-2));
    num.setAttribute("aria-hidden", "true");
    head.appendChild(icon);
    head.appendChild(num);
    li.appendChild(head);
    li.appendChild(el("h3", "scs-why__tile-title", t.title));
    li.appendChild(el("p", "", t.text));
    list.appendChild(li);
  });
  section.appendChild(list);

  root.appendChild(section);
})();
</script>
