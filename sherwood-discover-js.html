<div id="scs-disc-root"></div>
<script>
(function () {
  /* ===== EDIT HERE ===================================================== */
  var COLORS = {
    accent:      "#1F4E79", /* button + subheading color */
    accentHover: "#163A5B", /* button on hover */
    buttonText:  "#FFFFFF"
  };

  /* Image: upload to Media > Add New, click it, "Copy URL to clipboard",
     and paste between the quotes. Leave "" to show the placeholder. */
  var IMAGE_URL = "https://sherwoodcharterschool.org/wp-content/uploads/2026/10/FullSizeRender-scaled.jpg";
  var IMAGE_ALT = "Students learning at Sherwood Charter School";

  var HEADING    = ""; /* leave "" for no heading */
  var SUBHEADING = "Finding the right school for your child matters.";
  var PARAGRAPHS = [
    "A small number of enrollment openings are still available for the 2026–27 school year in select middle school and elementary grades at Sherwood Charter School.",
    "At SCS, your child will be known, supported, and challenged in a small classroom environment where teachers have the time to understand how they learn and help them grow before their transition to high school.",
    "If you’re looking for a school where academic achievement, high enrichment activities, and character development are part of each student’s everyday experience, explore SCS for your family."
  ];
  /* bold blue line on its own paragraph after the others (leave "" for none) */
  var BOLD_ENDING = "We hear it all the time from our students and their families: This is a place where kids love coming to school!";
  var BUTTON_TEXT = "Apply Now";
  var BUTTON_URL  = "https://app.lotterease.com//cgi-bin/sl_V2_1.pl?nav=Parents_Registration&account_id=1325";
  /* ===================================================================== */

  var root = document.getElementById("scs-disc-root");
  if (!root) return;

  var css = [
    ".scs-disc{--a:" + COLORS.accent + ";--ah:" + COLORS.accentHover + ";--bt:" + COLORS.buttonText + ";",
    "font-family:inherit;color:inherit;max-width:1200px;margin:0 auto;padding:10px;}",
    ".scs-disc *,.scs-disc *::before,.scs-disc *::after{box-sizing:border-box;}",
    ".scs-disc .scs-disc__grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,4vw,3.5rem);align-items:stretch;}",
    ".scs-disc .scs-disc__copy{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;}",
    ".scs-disc h2.scs-disc__title{margin:0 0 .5rem;padding:0;}",
    ".scs-disc p.scs-disc__sub{margin:0 0 1.25rem;font-size:clamp(1.75rem,1.6vw + 1.1rem,2.5rem);line-height:1.2;font-weight:600;color:var(--a);}",
    ".scs-disc p.scs-disc__p{margin:0 0 1rem;font-size:1rem;line-height:1.6;}",
    ".scs-disc p.scs-disc__bold{margin:0 0 1rem;font-size:1rem;line-height:1.6;font-weight:700;color:var(--a);}",
    ".scs-disc a.scs-disc__btn{display:inline-block;margin-top:.75rem;padding:.85rem 2rem;border-radius:999px;background:var(--a);color:var(--bt);",
    "font-weight:700;font-size:1rem;line-height:1.2;letter-spacing:.02em;text-decoration:none;border:0;",
    "box-shadow:0 6px 16px -8px rgba(0,0,0,.35);transition:background-color .2s ease,transform .2s ease,box-shadow .2s ease;}",
    ".scs-disc a.scs-disc__btn:hover,.scs-disc a.scs-disc__btn:focus-visible{background:var(--ah);color:var(--bt);transform:translateY(-2px);",
    "box-shadow:0 10px 22px -10px rgba(0,0,0,.45);text-decoration:none;}",
    ".scs-disc a.scs-disc__btn:focus-visible{outline:3px solid var(--a);outline-offset:3px;}",
    /* image fills the full height of the text column */
    ".scs-disc .scs-disc__media{position:relative;margin:0;border-radius:12px;overflow:hidden;min-height:320px;}",
    ".scs-disc .scs-disc__media img{position:absolute;inset:0;display:block;width:100%;height:100%;max-width:none;margin:0;object-fit:cover;}",
    ".scs-disc .scs-disc__ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;width:100%;height:100%;",
    "border:2px dashed var(--a);border-radius:12px;background:rgba(0,0,0,.03);color:var(--a);opacity:.6;",
    "font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;}",
    "@media (max-width:820px){.scs-disc .scs-disc__grid{grid-template-columns:1fr;}.scs-disc .scs-disc__media{min-height:0;aspect-ratio:4/3;}}",
    "@media (prefers-reduced-motion:reduce){.scs-disc a.scs-disc__btn{transition:none;}.scs-disc a.scs-disc__btn:hover{transform:none;}}"
  ].join("");

  if (!document.getElementById("scs-disc-style-v2")) {
    var style = document.createElement("style");
    style.id = "scs-disc-style-v2";
    style.textContent = css;
    document.head.appendChild(style);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }

  var section = el("section", "scs-disc");
  var grid = el("div", "scs-disc__grid");

  var copy = el("div", "scs-disc__copy");
  if (HEADING) {
    var h2 = el("h2", "scs-disc__title", HEADING);
    h2.id = "scs-disc-title";
    copy.appendChild(h2);
    section.setAttribute("aria-labelledby", "scs-disc-title");
  } else {
    section.setAttribute("aria-label", SUBHEADING);
  }
  copy.appendChild(el("p", "scs-disc__sub", SUBHEADING));
  PARAGRAPHS.forEach(function (t) { copy.appendChild(el("p", "scs-disc__p", t)); });
  if (BOLD_ENDING) copy.appendChild(el("p", "scs-disc__bold", BOLD_ENDING));
  var btn = el("a", "scs-disc__btn", BUTTON_TEXT);
  btn.href = BUTTON_URL;
  copy.appendChild(btn);

  var media = el("figure", "scs-disc__media");
  if (IMAGE_URL) {
    var img = el("img");
    img.src = IMAGE_URL;
    img.alt = IMAGE_ALT;
    var IMG_CSS = { position: "absolute", top: "0", left: "0", width: "100%", height: "100%",
      "max-width": "none", "max-height": "none", margin: "0", "object-fit": "cover" };
    Object.keys(IMG_CSS).forEach(function (k) { img.style.setProperty(k, IMG_CSS[k], "important"); });
    media.appendChild(img);
  } else {
    media.appendChild(el("div", "scs-disc__ph", "Image"));
  }

  /* inline backups so the full-height image wins over theme or cached CSS */
  var wide = window.matchMedia("(min-width:821px)");
  function imp(n, prop, val) { n.style.setProperty(prop, val, "important"); }
  function fit() {
    imp(grid, "align-items", "stretch");
    imp(media, "position", "relative");
    imp(media, "aspect-ratio", wide.matches ? "auto" : "4 / 3");
    imp(media, "min-height", wide.matches ? "320px" : "0");
    imp(media, "height", "auto");
  }
  fit();
  if (wide.addEventListener) wide.addEventListener("change", fit);

  grid.appendChild(copy);
  grid.appendChild(media);
  section.appendChild(grid);
  root.appendChild(section);
})();
</script>
